# SESEMSG cloud relay - remote viewing of the hub's dashboard (src/worker.js)
# Deploy:  npm run deploy        Local test:  npm run dev
# Secrets (once, after `npx wrangler login`):
#   npx wrangler secret put HUB_KEY       # same value as RELAY_KEY in the door node's secrets.h
#   npx wrangler secret put PASSCODE      # the dashboard passcode
#   npx wrangler secret put SESSION_KEY   # any long random string
# Local test secrets go in .dev.vars (git-ignored), same three names.
name = "sesemsg"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]
