<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1418">
  <title>TroDes - Caregiver Dashboard</title>
  <!-- Inline favicon: avoids a 404 on every load, which would otherwise
       clutter the console a caregiver or examiner might open. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%231f9e55'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%230f1418'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<!-- Banner and header scroll as one sticky block. Two independently
     sticky elements overlap once the page scrolls, and the thing that
     gets covered is the alert. -->
<div id="sticky-top">
<div id="banner"><!-- critical alert banner is injected here --></div>

<header class="topbar">
  <div class="brand">
    <h1>Caregiver Dashboard</h1>
    <span class="facility" id="facility">Loading&hellip;</span>
  </div>

  <div class="counters" id="counters"></div>

  <label class="whoami">
    On duty
    <input id="caregiver" type="text" placeholder="Your name"
           autocomplete="name" maxlength="64">
  </label>

  <div class="conn" id="conn">
    <span class="dot"></span><span id="conn-text">connecting&hellip;</span>
  </div>
</header>
</div>

<main>
  <section>
    <h2 class="section-title">Residents</h2>
    <div class="grid" id="residents">
      <div class="empty">Waiting for the first device report&hellip;</div>
    </div>
  </section>

  <section>
    <h2 class="section-title">Active alerts</h2>
    <div id="alerts"><div class="empty">No active alerts.</div></div>
  </section>

  <section>
    <h2 class="section-title">Restricted doors</h2>
    <div class="grid" id="doors" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))"></div>
  </section>

  <section>
    <h2 class="section-title">Recent activity</h2>
    <div id="recent"><div class="empty">Nothing recorded yet.</div></div>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
