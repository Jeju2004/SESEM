; --- Build output location -------------------------------------------------
; Build artifacts go OUTSIDE this folder, for two reasons:
;   1. The vault path contains parentheses -- "(SESEM)" -- which PlatformIO's
;      SCons layer mishandles on Windows: it fails to create .pio and the
;      build dies with FileNotFoundError before compiling anything.
;   2. A PlatformIO build tree is thousands of files. Left in the vault,
;      Obsidian indexes them and any sync client tries to upload them.
; C:/pio has no spaces, no parentheses, and is not synced. Nothing in it is
; precious -- delete the whole folder any time to force a clean rebuild.
; TroDes Phase 1 — Restricted-Door Sensor Node
;
; TWO ENVIRONMENTS ARE DEFINED. Pick the one that matches the physical board:
;   d1_mini   = Wemos D1 mini / NodeMCU  (ESP8266)
;   esp32dev  = ESP32-WROOM-32 devkit    (ESP32)
;
; `default_envs` below decides which one a plain Build/Upload click uses.
; If you flash the wrong one, esptool stops with:
;     "This chip is ESP32 not ESP8266. Wrong --chip argument?"
; That is a board/environment mismatch, not a code problem — the build itself
; will have succeeded.
;
; From the terminal you can also be explicit:
;   pio run -e esp32dev -t upload
;   pio run -e d1_mini  -t upload

[platformio]
build_dir   = C:/pio/door/build
libdeps_dir = C:/pio/door/libdeps
; <<< CHANGE THIS LINE to switch board family >>>
default_envs = esp32dev

; --- ESP32 (ESP32-WROOM-32 devkit) -------------------------------------------
[env:esp32dev]
platform  = espressif32 @ 6.5.0
board     = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
; Pin the port when more than one board is plugged in:
upload_port  = COM8
monitor_port = COM8

; --- ESP8266 (Wemos D1 mini) --------------------------------------------------
[env:d1_mini]
platform  = espressif8266 @ 4.2.1
board     = d1_mini
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
; upload_port  = COM7
; monitor_port = COM7
