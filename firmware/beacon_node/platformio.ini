; --- Build output location -------------------------------------------------
; Build artifacts go OUTSIDE this folder, for two reasons:
;   1. The vault path contains parentheses -- "(SESEM)" -- which PlatformIO's
;      SCons layer mishandles on Windows: it fails to create .pio and the
;      build dies with FileNotFoundError before compiling anything.
;   2. A PlatformIO build tree is thousands of files. Left in the vault,
;      Obsidian indexes them and any sync client tries to upload them.
; C:/pio has no spaces, no parentheses, and is not synced. Nothing in it is
; precious -- delete the whole folder any time to force a clean rebuild.
[platformio]
build_dir   = C:/pio/beacon/build
libdeps_dir = C:/pio/beacon/libdeps

; TroDes Phase 1 — Zone Beacon Node
; One flashed image per zone. Edit include/zone_config.h before each flash.

[env:esp32dev]
platform  = espressif32 @ 6.5.0
board     = esp32dev
framework = arduino

monitor_speed = 115200

; Port pinned so the wrong board cannot be flashed by mistake.
upload_port  = COM8
monitor_port = COM8

; --- Multi-board flashing -------------------------------------------------
; With two or more boards plugged in, PlatformIO's port auto-detection can
; pick the wrong one. Find this board's port in Device Manager (unplug it and
; see which COM port disappears), then uncomment and fill in both lines.

build_flags =
    -DCORE_DEBUG_LEVEL=1
