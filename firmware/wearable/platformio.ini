; --- Build output location -------------------------------------------------
; Build artifacts go OUTSIDE this folder, for two reasons:
;   1. The vault path contains parentheses -- "(SESEM)" -- which PlatformIO's
;      SCons layer mishandles on Windows: it fails to create .pio and the
;      build dies with FileNotFoundError before compiling anything.
;   2. A PlatformIO build tree is thousands of files. Left in the vault,
;      Obsidian indexes them and any sync client tries to upload them.
; C:/pio has no spaces, no parentheses, and is not synced. Nothing in it is
; precious -- delete the whole folder any time to force a clean rebuild.
[platformio]
build_dir   = C:/pio/wearable/build
libdeps_dir = C:/pio/wearable/libdeps

; TroDes Phase 1 — Wearable
;
; NOTE: board_build.partitions = huge_app.csv is REQUIRED.
; BLE + WiFi + HTTPClient + ArduinoJson + the two SparkFun sensor libraries
; produce a ~1.6 MB binary, which does not fit the ESP32's default ~1.25 MB
; app partition ("program size ... greater than maximum allowed").
; huge_app gives ~3 MB by giving up the second OTA slot — unused here, since
; this board is flashed over USB.

[env:esp32dev]
platform  = espressif32 @ 6.5.0
board     = esp32dev
framework = arduino

board_build.partitions = huge_app.csv
monitor_speed = 115200

; Port pinned so the wrong board cannot be flashed by mistake.
upload_port  = COM10
monitor_port = COM10

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
    sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library @ ^1.0.4

; --- Multi-board flashing -------------------------------------------------
; With the beacon and the wearable both plugged in, PlatformIO's port
; auto-detection can pick the wrong board. Pin the port explicitly:

build_flags =
    -DCORE_DEBUG_LEVEL=1
