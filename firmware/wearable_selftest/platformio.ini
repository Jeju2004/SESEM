; TroDes wearable - hardware self-test (serial report). Not the product firmware:
; flash it, read the report, then flash firmware/wearable again.
;   pio run -t upload --upload-port COM8   then   pio device monitor -p COM8
[platformio]
build_dir   = C:/pio/wearable_selftest/build
libdeps_dir = C:/pio/wearable/libdeps

[env:esp32dev]
platform  = espressif32 @ 6.5.0
board     = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
lib_deps =
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2
build_flags = -DCORE_DEBUG_LEVEL=1
